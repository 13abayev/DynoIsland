<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island</title>
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; background: #0b0b0d; color: #f5f5f7; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #8e8e93; }
  input { box-sizing: border-box; width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid #2c2c30; background: #141417; color: #f5f5f7; font: 12px Consolas, monospace; }
  button { margin-top: 8px; padding: 7px 14px; border: 0; border-radius: 9px; background: #f5f5f7; color: #000; font: 600 12px "Segoe UI", sans-serif; cursor: pointer; }
  .status { margin-top: 12px; font-weight: 600; }
  .on { color: #30d158; } .off { color: #8e8e93; }
</style>
</head>
<body>
<h1>Island</h1>
<p>Paste the token from Island's settings (the gear in the island → Copy token).</p>
<input id="token" placeholder="token" autocomplete="off" spellcheck="false">
<button id="save">Save</button>
<div class="status" id="status"></div>
<script src="options.js"></script>
</body>
</html>
